services:
  # ব্যাকএন্ড সার্ভিস
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8082:8080" # বাইরে ৮MD৮২, ভেতরে ৮০৮০
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://76.13.183.6:5432/mominpur
      - SPRING_DATASOURCE_USERNAME=mominpur_user
      - SPRING_DATASOURCE_PASSWORD=7xr&d6Wn@XQm4aK&
    volumes:
      - uploads:/app/uploads
    restart: always

  # ফ্রন্টএন্ড সার্ভিস
  frontend:
    build:
      context: ./mominpur-frontend
      dockerfile: Dockerfile
    ports:
      - "3005:3000" # বাইরে ৩০০৫ (কনফ্লিক্ট এড়াতে), ভেতরে ৩০০০
    environment:
      - NEXT_PUBLIC_API_URL=http://76.13.183.6:8082 # এপিআই কল যাবে ৮০৮২ পোর্টে
      - BACKEND_URL=http://backend:8080 # কম্পোজ নেটওয়ার্কের ভেতরে প্রক্সি টার্গেট
    restart: always
    depends_on:
      - backend

volumes:
  uploads: